<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OG Image - ЭстетикБро</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0A0A0A;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .og-container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0A0A0A 0%, #0D0D0F 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            box-sizing: border-box;
        }
        .og-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(46,168,255,0.1) 0%, transparent 70%);
        }
        h1 {
            color: white;
            font-size: 72px;
            font-weight: bold;
            margin: 0 0 20px 0;
            z-index: 1;
        }
        h1 span {
            color: #2EA8FF;
        }
        p {
            color: #9ca3af;
            font-size: 28px;
            margin: 0;
            z-index: 1;
        }
        .badge {
            position: absolute;
            top: 40px;
            left: 40px;
            padding: 12px 24px;
            background: rgba(46,168,255,0.15);
            border: 1px solid rgba(46,168,255,0.3);
            border-radius: 8px;
            color: #2EA8FF;
            font-size: 18px;
            z-index: 1;
        }
        .rating {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 8px;
            z-index: 1;
        }
        .star {
            color: #fbbf24;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div class="og-container">
        <div class="badge">⭐ Рейтинг 4.8 на Яндекс Картах</div>
        <h1>Эстетик<span>Бро</span></h1>
        <p>Профессиональный детейлинг автомобилей в Челябинске</p>
        <div class="rating">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>
    </div>
</body>
</html>
